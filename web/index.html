<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- RELEASE_IDENTITY -->
    <title>图片编辑画布</title>
    <style>
      :root {
        --bg: var(--color-background-secondary, #f4f5f7);
        --surface: var(--color-background-primary, #ffffff);
        --surface-muted: var(--color-background-secondary, #f8f9fa);
        --surface-tertiary: var(--color-background-tertiary, #eef0f2);
        --surface-inverse: var(--color-background-inverse, #181a1e);
        --line: var(--color-border-primary, #dedfe3);
        --line-strong: var(--color-border-secondary, #c8cbd1);
        --text: var(--color-text-primary, #17191d);
        --muted: var(--color-text-secondary, #6c7078);
        --subtle: var(--color-text-tertiary, #8d9299);
        --inverse-text: var(--color-text-inverse, #ffffff);
        --accent: var(--color-ring-primary, #15966f);
        --accent-strong: var(--color-text-info, #0c7959);
        --action-bg: var(--color-background-inverse, #0c7959);
        --action-text: var(--color-text-inverse, #ffffff);
        --selection-bg: var(--color-background-info, #e8f6f1);
        --selection-border: var(--color-border-info, #b8dfd1);
        --danger-bg: var(--color-background-danger, #fff7f7);
        --danger-text: var(--color-text-danger, #a52a2a);
        --danger-border: var(--color-border-danger, #e8b4b4);
        --success-bg: var(--color-background-success, #f2f8f6);
        --success-text: var(--color-text-success, #0c7959);
        --success-border: var(--color-border-success, #9fcfbe);
        --warning-bg: var(--color-background-warning, #fff9ed);
        --warning-text: var(--color-text-warning, #875d13);
        --warning-border: var(--color-border-warning, #d6a34a);
        --disabled-bg: var(--color-background-disabled, #d9dcdf);
        --disabled-text: var(--color-text-disabled, #8d9299);
        --checker-base: var(--color-background-secondary, #e9eaec);
        --checker-tile: var(--color-background-tertiary, #e2e3e6);
        --annotation: #ef4444;
        --focus: var(--color-ring-primary, #2563eb);
        --radius: var(--border-radius-sm, 6px);
        --app-shadow-sm: var(--shadow-sm, 0 4px 14px rgba(20,24,30,.1));
        --app-shadow-md: var(--shadow-md, 0 12px 28px rgba(20,24,30,.2));
        --app-shadow-lg: var(--shadow-lg, 0 16px 42px rgba(20,24,30,.2));
        --overlay: color-mix(in srgb, var(--text) 24%, transparent);
        --toolbar-width: 58px;
        font-family: var(--font-sans, Aptos, "Segoe UI", "Microsoft YaHei UI", sans-serif);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 0; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
      button, textarea, select, input { font: inherit; }
      button { color: inherit; }
      main { width: 100%; height: 100%; }
      .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
      .inline-results { display: grid; width: 100%; height: 100%; min-height: 220px; overflow: auto; background: var(--bg); }
      .inline-results.multiple { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); grid-auto-rows: max-content; align-items: start; align-content: start; gap: 8px; padding: 8px; }
      .inline-result { display: grid; grid-template-columns: minmax(180px, 42%) minmax(220px, 1fr); width: 100%; height: 100%; min-height: 220px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
      .inline-results.multiple .inline-result { grid-template-columns: 1fr; grid-template-rows: auto auto; width: 100%; height: auto; min-width: 0; min-height: 0; align-self: start; }
      body[data-view="result"] { height: auto; overflow: visible; }
      body[data-view="result"] main, body[data-view="result"] .inline-results, body[data-view="result"] .inline-result { height: auto; }
      body[data-view="result"] .inline-results { min-height: 0; overflow: visible; }
      body[data-preview-open="true"], body[data-preview-open="true"] main { height: 100%; overflow: hidden; }
      .inline-preview { display: grid; min-width: 0; min-height: 0; place-items: center; overflow: hidden; border-right: 1px solid var(--line); background-color: var(--checker-base); background-image: linear-gradient(45deg, var(--checker-tile) 25%, transparent 25%), linear-gradient(-45deg, var(--checker-tile) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--checker-tile) 75%), linear-gradient(-45deg, transparent 75%, var(--checker-tile) 75%); background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0; }
      .inline-preview .source-image { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: contain; }
      .inline-results.multiple .inline-preview { position: relative; aspect-ratio: 16 / 10; border-right: 0; border-bottom: 1px solid var(--line); }
      .inline-results.multiple .inline-preview-trigger { position: absolute; inset: 0; }
      .inline-results.multiple .source-image { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
      .inline-preview-trigger { position: relative; display: grid; width: 100%; height: 100%; min-height: 0; padding: 0; overflow: hidden; border: 0; background: transparent; cursor: zoom-in; }
      .inline-preview-trigger:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
      .inline-preview-affordance { position: absolute; right: 10px; bottom: 10px; display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid var(--color-border-inverse, rgba(255,255,255,.72)); border-radius: var(--radius); opacity: 0; transform: translateY(3px); background: color-mix(in srgb, var(--surface-inverse) 76%, transparent); color: var(--inverse-text); box-shadow: var(--app-shadow-sm); transition: opacity 140ms ease, transform 140ms ease; }
      .inline-preview-affordance svg { width: 16px; height: 16px; }
      .inline-preview-trigger:hover .inline-preview-affordance, .inline-preview-trigger:focus-visible .inline-preview-affordance { opacity: 1; transform: translateY(0); }
      .inline-loading, .inline-error { padding: 18px; color: var(--muted); font-size: 12px; text-align: center; }
      .inline-error { color: var(--danger-text); }
      .inline-details { display: flex; min-width: 0; flex-direction: column; justify-content: center; align-items: flex-start; gap: 14px; padding: 22px; }
      .inline-results.multiple .inline-details { align-self: start; justify-content: flex-start; gap: 10px; padding: 14px 16px 16px; }
      .inline-copy { display: grid; min-width: 0; gap: 4px; }
      .inline-copy strong { overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
      .inline-copy > span:last-child { overflow: hidden; color: var(--muted); font-family: var(--font-mono, Consolas, monospace); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .open-editor-button { min-width: 116px; height: 38px; padding: 0 16px; border: 0; border-radius: var(--radius); background: var(--action-bg); color: var(--action-text); font-size: 12px; font-weight: 700; cursor: pointer; }
      .open-editor-button:hover:not(:disabled) { background: var(--action-bg); }
      .open-editor-button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .open-editor-button:disabled { background: var(--disabled-bg); color: var(--disabled-text); cursor: not-allowed; }
      .canvas-destroyed-status { display: inline-flex; min-height: 32px; align-items: center; color: var(--muted); font-size: 11px; font-weight: 650; }
      .inline-status { min-height: 16px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .inline-status[data-status-tone="progress"] { color: var(--accent-strong); }
      .inline-status[data-status-tone="success"] { color: var(--success-text); }
      .inline-status[data-status-tone="error"] { color: var(--danger-text); }
      .inline-draft-state { display: inline-flex; min-height: 24px; align-items: center; padding: 0 7px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); font-size: 10px; font-weight: 650; }
      .inline-draft-state[data-draft-state="writing"] { border-color: var(--selection-border); color: var(--accent-strong); }
      .inline-draft-state[data-draft-state="pending"] { border-color: var(--success-border); background: var(--success-bg); color: var(--success-text); }
      .inline-draft-state[data-draft-state="updated"] { border-color: var(--warning-border); background: var(--warning-bg); color: var(--warning-text); }
      .result-preview { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: 58px minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--checker-base); color: var(--text); }
      .result-preview-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line-strong); background: var(--surface); box-shadow: var(--app-shadow-sm); }
      .result-preview-identity { display: grid; min-width: 0; gap: 2px; }
      .result-preview-identity strong, .result-preview-identity span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .result-preview-identity strong { font-size: 13px; font-weight: 650; }
      .result-preview-identity span { color: var(--muted); font-family: var(--font-mono, Consolas, monospace); font-size: 9px; }
      .result-preview-status { min-width: 0; color: var(--danger-text); font-size: 10px; text-align: right; }
      .result-preview-status[data-status-tone="progress"] { color: var(--accent-strong); }
      .result-preview-status[data-status-tone="success"] { color: var(--success-text); }
      .result-preview-controls { display: flex; align-items: center; gap: 3px; }
      .result-preview-icon, .result-preview-scale { display: grid; height: 36px; place-items: center; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--text); cursor: pointer; }
      .result-preview-icon { width: 36px; padding: 0; }
      .result-preview-icon svg { width: 17px; height: 17px; }
      .result-preview-scale { width: 56px; padding: 0 6px; color: var(--muted); font-family: var(--font-mono, Consolas, monospace); font-size: 10px; }
      .result-preview-icon:hover:not(:disabled), .result-preview-scale:hover:not(:disabled) { border-color: var(--line); background: var(--surface-muted); }
      .result-preview-icon:focus-visible, .result-preview-scale:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .result-preview-rule { width: 1px; height: 22px; margin: 0 3px; background: var(--line); }
      .result-preview-viewport { min-width: 0; min-height: 0; overflow: auto; overscroll-behavior: contain; background-color: var(--checker-base); background-image: linear-gradient(45deg, var(--checker-tile) 25%, transparent 25%), linear-gradient(-45deg, var(--checker-tile) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--checker-tile) 75%), linear-gradient(-45deg, transparent 75%, var(--checker-tile) 75%); background-size: 22px 22px; background-position: 0 0, 0 11px, 11px -11px, -11px 0; touch-action: none; }
      .result-preview-viewport[data-can-pan="true"] { cursor: grab; }
      .result-preview[data-panning="true"] .result-preview-viewport { cursor: grabbing; }
      .result-preview-stage { display: grid; min-width: 100%; min-height: 100%; place-items: center; }
      .result-preview-image { display: block; max-width: none; max-height: none; object-fit: contain; user-select: none; box-shadow: var(--app-shadow-lg); }
      .result-context-menu { position: fixed; z-index: 60; min-width: 184px; padding: 4px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); box-shadow: var(--app-shadow-md); }
      .result-context-menu button { display: flex; width: 100%; height: 34px; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; color: var(--text); font-size: 11px; font-weight: 600; text-align: left; cursor: pointer; }
      .result-context-menu button:hover { background: var(--surface-muted); }
      .result-context-menu button:focus-visible { background: var(--surface-muted); outline: 2px solid var(--focus); outline-offset: 1px; }
      .result-context-menu svg { width: 16px; height: 16px; color: var(--muted); }
      .editor-app { display: grid; grid-template-rows: 58px minmax(0, 1fr) 132px; width: 100%; height: 100%; min-width: 720px; background: var(--surface); }
      .topbar { display: grid; grid-template-columns: minmax(210px, 1fr) auto minmax(300px, 1fr); align-items: center; gap: 16px; padding: 0 14px 0 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
      .identity { display: flex; min-width: 0; align-items: center; gap: 9px; }
      .identity div { display: grid; min-width: 0; gap: 2px; }
      .identity strong, .identity span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .identity strong { font-size: 13px; font-weight: 650; }
      .identity span { font-size: 10px; color: var(--muted); }
      .lineage-crumb { font-size: 11px; color: var(--muted); white-space: nowrap; }
      .top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 3px; }
      .close-guidance-wrap { position: relative; display: inline-flex; min-width: 0; margin-right: 5px; }
      .close-guidance { display: inline-flex; min-width: 0; align-items: center; gap: 5px; padding: 2px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 9px; line-height: 1.3; white-space: nowrap; cursor: help; }
      .close-guidance:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .close-guidance-mark { display: grid; width: 15px; height: 15px; flex: 0 0 15px; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; font-family: Georgia, serif; font-size: 10px; font-weight: 700; }
      .close-guidance-tooltip { position: absolute; z-index: 12; top: calc(100% + 7px); right: 0; width: min(260px, calc(100vw - 24px)); padding: 8px 10px; visibility: hidden; opacity: 0; border: 1px solid var(--color-border-inverse, var(--line-strong)); border-radius: var(--radius); background: var(--surface-inverse); color: var(--inverse-text); font-size: 10px; line-height: 1.5; white-space: normal; box-shadow: var(--app-shadow-md); pointer-events: none; transition: opacity 140ms ease, visibility 0s linear 140ms; }
      .close-guidance-wrap[data-open="true"] .close-guidance-tooltip { visibility: visible; opacity: 1; transition-delay: 0s; }
      .text-icon, .tool-button, .stroke-button { display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; }
      .return-button { display: inline-flex; height: 32px; flex: 0 0 auto; align-items: center; gap: 5px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 11px; font-weight: 650; cursor: pointer; }
      .return-button svg { width: 16px; height: 16px; }
      .text-icon { width: 32px; height: 32px; border-radius: var(--radius); font-size: 18px; }
      .text-icon:hover, .return-button:hover, .tool-button:hover, .stroke-button:hover { background: var(--surface-tertiary); }
      .destroy-button { display: inline-flex; height: 30px; margin-left: 5px; align-items: center; gap: 5px; padding: 0 9px; border: 1px solid var(--danger-border); border-radius: var(--radius); background: var(--danger-bg); color: var(--danger-text); font-size: 11px; font-weight: 650; white-space: nowrap; cursor: pointer; }
      .destroy-button svg { width: 14px; height: 14px; }
      .destroy-button:hover { border-color: var(--danger-border); background: var(--danger-bg); }
      button:disabled, select:disabled, textarea:disabled, input:disabled { cursor: not-allowed; opacity: .48; }
      button[aria-disabled="true"] { cursor: not-allowed; opacity: .48; }
      .text-icon, .return-button, .tool-button, .stroke-button, .swatch, .segmented-control button, .intent-panel-toggle, .open-editor-button, .submit-button, .quiet-button, .destroy-button, .danger-confirm, .version-item { transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease, opacity 140ms ease, transform 140ms ease; }
      button:active:not(:disabled) { transform: translateY(1px); }
      .intent-panel-toggle { display: none; height: 30px; align-items: center; gap: 5px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 11px; font-weight: 650; cursor: pointer; }
      .text-icon:focus-visible, .return-button:focus-visible, .tool-button:focus-visible, .stroke-button:focus-visible, .swatch:focus-visible, .submit-button:focus-visible, .quiet-button:focus-visible, .destroy-button:focus-visible, .danger-confirm:focus-visible, .version-item:focus-visible, .segmented-control button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .zoom-control { display: flex; align-items: center; margin: 0 4px; font-size: 11px; color: var(--muted); }
      .zoom-control select { width: 60px; height: 30px; padding: 0 5px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
      .zoom-control select:hover { border-color: var(--line); background: var(--surface-muted); }
      .workspace { display: grid; grid-template-columns: var(--toolbar-width) minmax(0, 1fr) minmax(230px, 25%); min-height: 0; background: var(--bg); }
      .tool-rail { z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 7px; border-right: 1px solid var(--line); background: var(--surface); }
      .tool-button { width: 40px; height: 40px; flex: 0 0 40px; border-radius: var(--radius); font-size: 20px; }
      .tool-button.active { background: var(--selection-bg); color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--selection-border); }
      .rail-rule { width: 28px; height: 1px; margin: 4px 0; background: var(--line); }
      .rail-style-controls { display: flex; flex-direction: column; align-items: center; gap: 1px; }

      .foreground-color-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .swatch { position: relative; display: grid; width: 40px; height: 40px; flex: 0 0 40px; place-items: center; border: 0; border-radius: var(--radius); background: transparent; cursor: pointer; }
      .swatch:hover:not(:disabled), .swatch[aria-expanded="true"] { background: var(--surface-tertiary); }

      .color-edit-button { width: 32px; height: 28px; margin-top: 3px; border: 1px solid var(--line); background: var(--surface-muted); color: var(--muted); }
      .color-edit-button:hover:not(:disabled) { border-color: var(--line-strong); background: var(--surface-tertiary); color: var(--text); }
      .color-edit-button svg { width: 14px; height: 14px; }
      .color-editor-overlay { position: fixed; inset: 0; z-index: 20; overflow: hidden; pointer-events: none; contain: layout style; }
      .color-editor-overlay[data-open="true"] { pointer-events: auto; }
      .editor-app[data-color-editor-open="true"] .tool-rail { z-index: 21; }

      .custom-color-panel[hidden] { display: none; }

      .custom-color-panel[data-placement="left"]::before { right: -6px; border-top: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); }

      .custom-color-area:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

      .custom-color-hue::-webkit-slider-thumb { width: 10px; height: 22px; appearance: none; border: 2px solid #fff; border-radius: 3px; background: transparent; box-shadow: 0 0 0 1px #4d5158; }

      .custom-color-hue:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .custom-color-previews { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .custom-color-previews > div { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 6px; color: var(--muted); font-size: 9px; font-weight: 650; }
