<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片编辑画布</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-muted: #f8f9fa;
        --line: #dedfe3;
        --line-strong: #c8cbd1;
        --text: #17191d;
        --muted: #6c7078;
        --accent: #15966f;
        --accent-strong: #0c7959;
        --annotation: #ef4444;
        --focus: #2563eb;
        --radius: 6px;
        --toolbar-width: 58px;
        font-family: Aptos, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 0; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
      button, textarea, select { font: inherit; }
      button { color: inherit; }
      main { width: 100%; height: 100%; }
      .inline-results { display: grid; width: 100%; height: 100%; min-height: 220px; overflow: auto; background: var(--bg); }
      .inline-results.multiple { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); grid-auto-rows: minmax(220px, 1fr); gap: 8px; padding: 8px; }
      .inline-result { display: grid; grid-template-columns: minmax(180px, 42%) minmax(220px, 1fr); width: 100%; height: 100%; min-height: 220px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
      body[data-view="result"] { height: auto; overflow: visible; }
      body[data-view="result"] main, body[data-view="result"] .inline-results, body[data-view="result"] .inline-result { height: auto; }
      body[data-view="result"] .inline-results { min-height: 0; overflow: visible; }
      .inline-preview { display: grid; min-width: 0; min-height: 0; place-items: center; overflow: hidden; border-right: 1px solid var(--line); background-color: #e9eaec; background-image: linear-gradient(45deg, #e2e3e6 25%, transparent 25%), linear-gradient(-45deg, #e2e3e6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e3e6 75%), linear-gradient(-45deg, transparent 75%, #e2e3e6 75%); background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0; }
      .inline-preview .source-image { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: contain; }
      .inline-loading { padding: 18px; color: var(--muted); font-size: 12px; text-align: center; }
      .inline-details { display: flex; min-width: 0; flex-direction: column; justify-content: center; align-items: flex-start; gap: 14px; padding: 22px; }
      .inline-copy { display: grid; min-width: 0; gap: 4px; }
      .inline-copy strong { overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
      .inline-copy > span:last-child { overflow: hidden; color: var(--muted); font-family: Consolas, monospace; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .open-editor-button { min-width: 116px; height: 38px; padding: 0 16px; border: 0; border-radius: var(--radius); background: var(--accent); color: white; font-size: 12px; font-weight: 700; cursor: pointer; }
      .open-editor-button:hover:not(:disabled) { background: var(--accent-strong); }
      .open-editor-button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .open-editor-button:disabled { background: #d9dcdf; color: #8d9299; cursor: not-allowed; }
      .canvas-destroyed-status { display: inline-flex; min-height: 32px; align-items: center; color: var(--muted); font-size: 11px; font-weight: 650; }
      .inline-status { min-height: 16px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .inline-status[data-status-tone="progress"] { color: var(--accent-strong); }
      .inline-status[data-status-tone="error"] { color: #b42318; }
      .editor-app { display: grid; grid-template-rows: 58px minmax(0, 1fr) 132px; width: 100%; height: 100%; min-width: 720px; background: var(--surface); }
      .topbar { display: grid; grid-template-columns: minmax(210px, 1fr) auto minmax(300px, 1fr); align-items: center; gap: 16px; padding: 0 14px 0 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
      .identity { display: flex; min-width: 0; align-items: center; gap: 9px; }
      .identity div { display: grid; min-width: 0; gap: 2px; }
      .identity strong, .identity span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .identity strong { font-size: 13px; font-weight: 650; }
      .identity span { font-size: 10px; color: var(--muted); }
      .lineage-crumb { font-size: 11px; color: var(--muted); white-space: nowrap; }
      .top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 3px; }
      .close-guidance { display: inline-flex; min-width: 0; align-items: center; gap: 5px; margin-right: 5px; color: var(--muted); font-size: 9px; line-height: 1.3; white-space: nowrap; }
      .close-guidance-mark { display: grid; width: 15px; height: 15px; flex: 0 0 15px; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; font-family: Georgia, serif; font-size: 10px; font-weight: 700; }
      .text-icon, .tool-button, .stroke-button { display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; }
      .return-button { display: inline-flex; height: 32px; flex: 0 0 auto; align-items: center; gap: 5px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 11px; font-weight: 650; cursor: pointer; }
      .return-button svg { width: 16px; height: 16px; }
      .text-icon { width: 32px; height: 32px; border-radius: var(--radius); font-size: 18px; }
      .text-icon:hover, .return-button:hover, .tool-button:hover, .stroke-button:hover { background: #eef0f2; }
      .destroy-button { display: inline-flex; height: 30px; margin-left: 5px; align-items: center; gap: 5px; padding: 0 9px; border: 1px solid #e8b4b4; border-radius: var(--radius); background: #fff7f7; color: #a52a2a; font-size: 11px; font-weight: 650; white-space: nowrap; cursor: pointer; }
      .destroy-button svg { width: 14px; height: 14px; }
      .destroy-button:hover { border-color: #d98d8d; background: #ffeded; }
      button:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .48; }
      .intent-panel-toggle { display: none; height: 30px; align-items: center; gap: 5px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 11px; font-weight: 650; cursor: pointer; }
      .text-icon:focus-visible, .return-button:focus-visible, .tool-button:focus-visible, .stroke-button:focus-visible, .submit-button:focus-visible, .quiet-button:focus-visible, .destroy-button:focus-visible, .version-item:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .zoom-control { display: flex; align-items: center; margin: 0 4px; font-size: 11px; color: var(--muted); }
      .zoom-control select { width: 60px; height: 30px; padding: 0 5px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
      .zoom-control select:hover { border-color: var(--line); background: var(--surface-muted); }
      .workspace { display: grid; grid-template-columns: var(--toolbar-width) minmax(0, 1fr) minmax(230px, 25%); min-height: 0; background: var(--bg); }
      .tool-rail { z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 7px; border-right: 1px solid var(--line); background: var(--surface); }
      .tool-button { width: 40px; height: 40px; flex: 0 0 40px; border-radius: var(--radius); font-size: 20px; }
      .tool-button.active { background: #e8f6f1; color: var(--accent-strong); box-shadow: inset 0 0 0 1px #b8dfd1; }
      .rail-rule { width: 28px; height: 1px; margin: 4px 0; background: var(--line); }
      .swatch { width: 22px; height: 22px; flex: 0 0 22px; border: 2px solid var(--surface); border-radius: 50%; background: var(--swatch, #ef4444); box-shadow: 0 0 0 1px var(--line-strong); cursor: pointer; }
      .swatch[data-color="#ef4444"] { --swatch: #ef4444; }
      .swatch[data-color="#2563eb"] { --swatch: #2563eb; }
      .swatch[data-color="#111827"] { --swatch: #111827; }
      .swatch.active { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
      .stroke-button { width: 34px; height: 26px; border-radius: 4px; font-weight: 800; color: var(--muted); }
      .stroke-button.active { color: var(--accent-strong); background: #e8f6f1; }
      .canvas-zone { min-width: 0; min-height: 0; padding: 18px; overflow: hidden; }
      .canvas-frame { position: relative; display: grid; place-items: center; width: 100%; height: 100%; min-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 2px; background-color: #e9eaec; background-image: linear-gradient(45deg, #e2e3e6 25%, transparent 25%), linear-gradient(-45deg, #e2e3e6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e3e6 75%), linear-gradient(-45deg, transparent 75%, #e2e3e6 75%); background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0; }
      .canvas-content { position: relative; display: grid; place-items: center; width: min(100%, 100vh); max-width: 100%; max-height: 100%; overflow: hidden; background: transparent; transform-origin: center; transition: transform 140ms ease; touch-action: none; }
      .source-image { width: 100%; height: 100%; object-fit: contain; user-select: none; pointer-events: none; }
      .annotation-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 140ms ease; }
      .empty-state { max-width: 260px; padding: 18px; color: var(--muted); text-align: center; font-size: 13px; background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: var(--radius); }
      .intent-panel { display: flex; min-width: 0; min-height: 0; flex-direction: column; padding: 18px 16px 14px; border-left: 1px solid var(--line); background: var(--surface); }
      .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
      .panel-heading-actions { display: flex; gap: 5px; }
      .panel-close { display: none; }
      .eyebrow { display: block; margin-bottom: 3px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
      h1 { margin: 0; font-size: 15px; font-weight: 680; }
      .quiet-button { height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font-size: 11px; cursor: pointer; }
      .intent-list { min-height: 0; flex: 1; overflow: auto; padding: 7px 0 12px; }
      .muted { margin: 10px 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
      .intent-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 8px; border-bottom: 1px solid #eceef0; border-radius: 4px; }
      .intent-item.selected { background: #f2f7f5; box-shadow: inset 3px 0 0 var(--accent); }
      .intent-number { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--annotation); color: white; font-size: 10px; font-weight: 700; }
      .intent-content { display: grid; gap: 2px; min-width: 0; }
      .intent-item strong { font-size: 11px; }
      .intent-item span { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .intent-item textarea { height: 66px; min-height: 66px; margin-top: 4px; }
      .annotation-item-meta { display: flex; flex-direction: row; justify-content: space-between; color: var(--muted); font-size: 9px; }
      .annotation-delete { width: 28px; justify-self: end; padding: 0; }
      .annotation-delete svg, .panel-close svg { width: 14px; height: 14px; }
      .prompt-label { margin-top: 4px; font-size: 11px; font-weight: 650; }
      textarea { width: 100%; height: 82px; min-height: 62px; margin-top: 7px; resize: none; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 9px 10px; color: var(--text); background: var(--surface); font-size: 11px; line-height: 1.55; }
      textarea:focus { border-color: var(--accent); outline: 2px solid #bce3d6; }
      textarea::placeholder { color: #9a9ea5; }
      .prompt-meta { display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); font-size: 9px; }
      .bottom-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; min-width: 0; border-top: 1px solid var(--line); background: var(--surface); }
      .version-strip { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-x: auto; padding: 12px 18px; }
      .version-strip:empty::after { content: "版本关系将在图片加载后显示"; color: var(--muted); font-size: 11px; }
      .version-item { display: grid; flex: 0 0 94px; grid-template-rows: 62px 18px; gap: 4px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 10px; text-align: center; cursor: pointer; }
      .version-thumb { display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-muted); }
      .version-thumb img { width: 100%; height: 100%; object-fit: cover; }
      .version-item.current .version-thumb { border-color: var(--accent); box-shadow: 0 0 0 2px #c6e9dd; }
      .version-item.current { color: var(--accent-strong); font-weight: 700; }
      .submit-row { display: flex; min-width: 280px; align-items: center; justify-content: flex-end; gap: 12px; padding: 16px 18px; border-left: 1px solid var(--line); }
      .submit-copy { display: grid; min-width: 120px; gap: 3px; text-align: right; }
      .annotation-summary { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .submit-status { min-height: 14px; color: var(--muted); font-size: 10px; line-height: 1.4; opacity: 0; }
      .submit-status.visible { opacity: 1; }
      .submit-status[data-status-tone="progress"] { color: var(--accent-strong); }
      .submit-status[data-status-tone="success"] { color: var(--accent-strong); }
      .submit-status[data-status-tone="error"] { color: #b42318; }
      .submit-button { min-width: 116px; height: 40px; border: 0; border-radius: var(--radius); background: var(--accent); color: white; font-size: 12px; font-weight: 700; cursor: pointer; }
      .submit-button:hover:not(:disabled) { background: var(--accent-strong); }
      .submit-button:disabled { background: #d9dcdf; color: #8d9299; cursor: not-allowed; }
      .toast { position: fixed; left: 50%; bottom: 142px; z-index: 10; max-width: min(360px, calc(100vw - 32px)); transform: translate(-50%, 12px); opacity: 0; padding: 9px 12px; border-radius: var(--radius); background: #181a1e; color: white; font-size: 11px; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease; }
      .toast.visible { transform: translate(-50%, 0); opacity: 1; }
      @media (max-width: 900px) {
        .inline-result { grid-template-columns: minmax(140px, 42%) minmax(0, 1fr); }
        .inline-details { gap: 10px; padding: 16px; }
        .editor-app { min-width: 0; grid-template-rows: 54px minmax(0, 1fr) 112px; }
        .topbar { grid-template-columns: minmax(170px, 1fr) auto; }
        .lineage-crumb { display: none; }
        .close-guidance-text { display: none; }
        .workspace { grid-template-columns: 52px minmax(0, 1fr); }
        .intent-panel-toggle, .panel-close { display: inline-flex; align-items: center; justify-content: center; }
        .intent-panel { z-index: 4; position: absolute; right: 0; top: 54px; bottom: 112px; width: min(300px, 82vw); visibility: hidden; transform: translateX(100%); transition: transform 180ms ease, visibility 0s linear 180ms; }
        .intent-panel.open { visibility: visible; transform: translateX(0); box-shadow: -8px 0 24px rgba(20,24,30,.12); transition-delay: 0s; }
        .tool-rail { overflow-y: auto; }
        .canvas-zone { padding: 10px; }
        .bottom-bar { grid-template-columns: minmax(0, 1fr) auto; }
        .version-item { flex-basis: 76px; grid-template-rows: 48px 16px; }
        .submit-row { padding: 12px; }
        .submit-row { min-width: 220px; }
        .annotation-summary { display: none; }
        .submit-button { min-width: 96px; }
      }
      @media (max-width: 520px) {
        .inline-results.multiple { grid-template-columns: 1fr; }
        .inline-result { grid-template-columns: 1fr; grid-template-rows: minmax(132px, 1fr) auto; }
        .inline-preview { border-right: 0; border-bottom: 1px solid var(--line); }
        .inline-details { padding: 14px; }
        .identity > div, .zoom-control, .top-actions [data-action="fit"], .top-actions [data-action="toggle-annotations"] { display: none; }
        .topbar { grid-template-columns: auto minmax(0, 1fr); padding-right: 8px; }
        .intent-panel-toggle, .destroy-button { width: 32px; padding: 0; justify-content: center; }
        .intent-panel-toggle span, .destroy-button span { display: none; }
        .submit-row { min-width: 120px; gap: 6px; padding: 8px; }
        .submit-copy { display: none; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body data-tool="open_image_editor">
    <main><p>正在加载图片...</p></main>
    <!-- WIDGET_SCRIPT -->
  </body>
</html>
