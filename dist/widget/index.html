<html lang="zh-CN">

    <title>图片编辑画布</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --surface: #ffffff;

      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 0; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }

      .inline-results.multiple { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); grid-auto-rows: max-content; align-items: start; align-content: start; gap: 8px; padding: 8px; }
      .inline-result { display: grid; grid-template-columns: minmax(180px, 42%) minmax(220px, 1fr); width: 100%; height: 100%; min-height: 220px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
      .inline-results.multiple .inline-result { grid-template-columns: 1fr; grid-template-rows: auto auto; width: 100%; height: auto; min-width: 0; min-height: 0; align-self: start; }
      body[data-view="result"] { height: auto; overflow: visible; }

      body[data-view="result"] .inline-results { min-height: 0; overflow: visible; }
      body[data-preview-open="true"], body[data-preview-open="true"] main { height: 100%; overflow: hidden; }
      .inline-preview { display: grid; min-width: 0; min-height: 0; place-items: center; overflow: hidden; border-right: 1px solid var(--line); background-color: #e9eaec; background-image: linear-gradient(45deg, #e2e3e6 25%, transparent 25%), linear-gradient(-45deg, #e2e3e6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e3e6 75%), linear-gradient(-45deg, transparent 75%, #e2e3e6 75%); background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0; }
      .inline-preview .source-image { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: contain; }
      .inline-results.multiple .inline-preview { position: relative; aspect-ratio: 16 / 10; border-right: 0; border-bottom: 1px solid var(--line); }
      .inline-results.multiple .inline-preview-trigger { position: absolute; inset: 0; }
      .inline-results.multiple .source-image { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
      .inline-preview-trigger { position: relative; display: grid; width: 100%; height: 100%; min-height: 0; padding: 0; overflow: hidden; border: 0; background: transparent; cursor: zoom-in; }
      .inline-preview-trigger:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
      .inline-preview-affordance { position: absolute; right: 10px; bottom: 10px; display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid rgba(255,255,255,.72); border-radius: var(--radius); opacity: 0; transform: translateY(3px); background: rgba(23,25,29,.76); color: #fff; box-shadow: 0 4px 12px rgba(20,24,30,.18); transition: opacity 140ms ease, transform 140ms ease; }

      .inline-loading, .inline-error { padding: 18px; color: var(--muted); font-size: 12px; text-align: center; }
      .inline-error { color: #b42318; }

      .inline-results.multiple .inline-details { align-self: start; justify-content: flex-start; gap: 10px; padding: 14px 16px 16px; }
      .inline-copy { display: grid; min-width: 0; gap: 4px; }
      .inline-copy strong { overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
      .inline-copy > span:last-child { overflow: hidden; color: var(--muted); font-family: Consolas, monospace; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .open-editor-button { min-width: 116px; height: 38px; padding: 0 16px; border: 0; border-radius: var(--radius); background: var(--accent-strong); color: white; font-size: 12px; font-weight: 700; cursor: pointer; }

      .canvas-destroyed-status { display: inline-flex; min-height: 32px; align-items: center; color: var(--muted); font-size: 11px; font-weight: 650; }
      .inline-status { min-height: 16px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .inline-status[data-status-tone="progress"] { color: var(--accent-strong); }

      .result-preview { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: 58px minmax(0, 1fr); min-width: 0; min-height: 0; background: #dfe1e4; color: var(--text); }
      .result-preview-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line-strong); background: var(--surface); box-shadow: 0 2px 8px rgba(20,24,30,.08); }

      .result-preview-controls { display: flex; align-items: center; gap: 3px; }
      .result-preview-icon, .result-preview-scale { display: grid; height: 36px; place-items: center; border: 1px solid transparent; border-radius: var(--radius); background: transparent; color: var(--text); cursor: pointer; }
      .result-preview-icon { width: 36px; padding: 0; }
      .result-preview-icon svg { width: 17px; height: 17px; }
      .result-preview-scale { width: 56px; padding: 0 6px; color: var(--muted); font-family: Consolas, monospace; font-size: 10px; }
      .result-preview-icon:hover:not(:disabled), .result-preview-scale:hover:not(:disabled) { border-color: var(--line); background: var(--surface-muted); }
      .result-preview-icon:focus-visible, .result-preview-scale:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .result-preview-rule { width: 1px; height: 22px; margin: 0 3px; background: var(--line); }

      .result-preview-viewport[data-can-pan="true"] { cursor: grab; }
      .result-preview[data-panning="true"] .result-preview-viewport { cursor: grabbing; }
      .result-preview-stage { display: grid; min-width: 100%; min-height: 100%; place-items: center; }
      .result-preview-image { display: block; max-width: none; max-height: none; object-fit: contain; user-select: none; box-shadow: 0 12px 34px rgba(20,24,30,.2); }
      .result-context-menu { position: fixed; z-index: 60; min-width: 184px; padding: 4px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); box-shadow: 0 12px 28px rgba(20,24,30,.2); }
      .result-context-menu button { display: flex; width: 100%; height: 34px; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; color: var(--text); font-size: 11px; font-weight: 600; text-align: left; cursor: pointer; }
      .result-context-menu button:hover { background: var(--surface-muted); }
      .result-context-menu button:focus-visible { background: var(--surface-muted); outline: 2px solid var(--focus); outline-offset: 1px; }
      .result-context-menu svg { width: 16px; height: 16px; color: var(--muted); }
      .editor-app { display: grid; grid-template-rows: 58px minmax(0, 1fr) 132px; width: 100%; height: 100%; min-width: 720px; background: var(--surface); }

      .close-guidance:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

      .close-guidance-tooltip { position: absolute; z-index: 12; top: calc(100% + 7px); right: 0; width: min(260px, calc(100vw - 24px)); padding: 8px 10px; visibility: hidden; opacity: 0; border: 1px solid var(--line-strong); border-radius: var(--radius); background: #181a1e; color: #fff; font-size: 10px; line-height: 1.5; white-space: normal; box-shadow: 0 8px 22px rgba(20,24,30,.18); pointer-events: none; transition: opacity 140ms ease, visibility 0s linear 140ms; }
      .close-guidance-wrap[data-open="true"] .close-guidance-tooltip { visibility: visible; opacity: 1; transition-delay: 0s; }
      .text-icon, .tool-button, .stroke-button { display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; }
      .return-button { display: inline-flex; height: 32px; flex: 0 0 auto; align-items: center; gap: 5px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 11px; font-weight: 650; cursor: pointer; }
      .return-button svg { width: 16px; height: 16px; }
      .text-icon { width: 32px; height: 32px; border-radius: var(--radius); font-size: 18px; }
      .text-icon:hover, .return-button:hover, .tool-button:hover, .stroke-button:hover { background: #eef0f2; }

      button:disabled, select:disabled, textarea:disabled, input:disabled { cursor: not-allowed; opacity: .48; }
      button[aria-disabled="true"] { cursor: not-allowed; opacity: .48; }
      .text-icon, .return-button, .tool-button, .stroke-button, .swatch, .segmented-control button, .intent-panel-toggle, .open-editor-button, .submit-button, .quiet-button, .destroy-button, .danger-confirm, .version-item { transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease, opacity 140ms ease, transform 140ms ease; }
      button:active:not(:disabled) { transform: translateY(1px); }

      .text-icon:focus-visible, .return-button:focus-visible, .tool-button:focus-visible, .stroke-button:focus-visible, .swatch:focus-visible, .submit-button:focus-visible, .quiet-button:focus-visible, .destroy-button:focus-visible, .danger-confirm:focus-visible, .version-item:focus-visible, .segmented-control button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

      .zoom-control select:hover { border-color: var(--line); background: var(--surface-muted); }
      .workspace { display: grid; grid-template-columns: var(--toolbar-width) minmax(0, 1fr) minmax(230px, 25%); min-height: 0; background: var(--bg); }

      .canvas-options-label { padding-left: 4px; color: var(--muted); font-size: 9px; font-weight: 650; white-space: nowrap; }
      .canvas-options-rule { width: 1px; height: 22px; background: var(--line); }
      .segmented-control { display: flex; align-items: center; }
      .segmented-control button { min-width: 76px; height: 30px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 650; cursor: pointer; }
      .segmented-control button.active { background: #e8f6f1; color: var(--accent-strong); }
      .mask-actions button { display: grid; width: 34px; min-width: 34px; padding: 0; place-items: center; }
      .mask-actions svg { width: 15px; height: 15px; }
      .brush-sizes button { min-width: 34px; padding: 0 8px; }
      .canvas-frame { position: relative; display: grid; place-items: safe center; width: 100%; height: 100%; min-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 2px; background-color: #e9eaec; background-image: linear-gradient(45deg, #e2e3e6 25%, transparent 25%), linear-gradient(-45deg, #e2e3e6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e3e6 75%), linear-gradient(-45deg, transparent 75%, #e2e3e6 75%); background-size: 18px 18px; background-position: 0 0, 0 9px, 9px -9px, -9px 0; }
      .canvas-content { position: relative; display: grid; flex: 0 0 auto; place-items: center; overflow: hidden; background: transparent; touch-action: none; }
      .canvas-content:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
      .source-image { width: 100%; height: 100%; object-fit: contain; user-select: none; pointer-events: none; }
      .annotation-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 140ms ease; }
      .annotation-layer foreignObject { overflow: visible; pointer-events: auto; }
      .canvas-text-editor { width: 100%; height: 38px; box-sizing: border-box; padding: 3px 6px; border: 1px solid var(--accent); border-radius: 2px; outline: 2px solid rgba(21,150,111,.22); background: rgba(255,255,255,.92); color: var(--canvas-text-color, #ef4444); font: 700 30px/1 sans-serif; letter-spacing: 0; pointer-events: auto; }
      .canvas-text-editor:focus { outline-color: rgba(21,150,111,.38); }
      .empty-state { max-width: 260px; padding: 18px; color: var(--muted); text-align: center; font-size: 13px; background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: var(--radius); }
      .intent-panel { display: flex; min-width: 0; min-height: 0; flex-direction: column; padding: 18px 16px 14px; border-left: 1px solid var(--line); background: var(--surface); }
      .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
      .panel-heading-actions { display: flex; gap: 5px; }
      .panel-close { display: none; }
      .eyebrow { display: block; margin-bottom: 3px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
      h1 { margin: 0; font-size: 15px; font-weight: 680; }
      .quiet-button { height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font-size: 11px; cursor: pointer; }
      .intent-list { min-height: 0; flex: 1; overflow: auto; padding: 7px 0 12px; }
      .muted { margin: 10px 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
      .intent-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 8px; border-bottom: 1px solid #eceef0; border-radius: 4px; }
      .intent-item.selected { background: #f2f7f5; box-shadow: inset 0 0 0 1px #d8e8e2; }
      .intent-number { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--item-color, var(--annotation)); color: white; font-size: 10px; font-weight: 700; }
      .intent-content { display: grid; gap: 2px; min-width: 0; }
      .intent-heading { display: flex; min-width: 0; align-items: center; gap: 6px; }
      .intent-item strong { font-size: 11px; }
      .intent-item span { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .annotation-color-chip { width: 9px; height: 9px; flex: 0 0 9px; border: 1px solid rgba(23,25,29,.28); border-radius: 50%; background: var(--annotation-color, #ef4444); }
      .intent-item textarea { height: 66px; min-height: 66px; margin-top: 4px; }
      .annotation-item-meta { display: flex; flex-direction: row; justify-content: space-between; color: var(--muted); font-size: 9px; }
      .annotation-item-actions { display: flex; min-width: 0; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 3px; }
      .annotation-apply-color { display: inline-flex; min-width: 0; align-items: center; gap: 4px; padding: 0 7px; color: var(--accent-strong); }
      .annotation-apply-color svg { width: 13px; height: 13px; }
      .annotation-delete { width: 28px; flex: 0 0 28px; padding: 0; }
      .annotation-delete svg, .panel-close svg { width: 14px; height: 14px; }
      .prompt-label { margin-top: 4px; font-size: 11px; font-weight: 650; }
      textarea { width: 100%; height: 82px; min-height: 62px; margin-top: 7px; resize: none; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 9px 10px; color: var(--text); background: var(--surface); font-size: 11px; line-height: 1.55; }
      textarea:focus { border-color: var(--accent); outline: 2px solid #bce3d6; }
      textarea::placeholder { color: #9a9ea5; }
      .prompt-meta { display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); font-size: 9px; }
      .bottom-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; min-width: 0; border-top: 1px solid var(--line); background: var(--surface); }
      .version-strip { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-x: auto; padding: 12px 18px; }
      .version-strip:empty::after { content: "版本关系将在图片加载后显示"; color: var(--muted); font-size: 11px; }
      .version-item { display: grid; flex: 0 0 94px; grid-template-rows: 62px 18px; gap: 4px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 10px; text-align: center; cursor: pointer; }
      .version-thumb { display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-muted); }
      .version-thumb img { width: 100%; height: 100%; object-fit: cover; }
      .version-loading { color: var(--muted); font-size: 9px; }
      .version-error { color: #b42318; font-size: 9px; }
      .version-item.current .version-thumb { border-color: var(--accent); box-shadow: 0 0 0 2px #c6e9dd; }
      .version-item.current { color: var(--accent-strong); font-weight: 700; }
      .submit-row { display: flex; min-width: 280px; align-items: center; justify-content: flex-end; gap: 12px; padding: 16px 18px; border-left: 1px solid var(--line); }
      .submit-copy { display: grid; min-width: 120px; gap: 3px; text-align: right; }
      .annotation-summary { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .submit-status { min-height: 14px; color: var(--muted); font-size: 10px; line-height: 1.4; opacity: 0; }
      .submit-status.visible { opacity: 1; }
      .submit-status[data-status-tone="progress"] { color: var(--accent-strong); }
      .submit-status[data-status-tone="success"] { color: var(--accent-strong); }
      .submit-status[data-status-tone="error"] { color: #b42318; }
      .submit-button { min-width: 116px; height: 40px; border: 0; border-radius: var(--radius); background: var(--accent-strong); color: white; font-size: 12px; font-weight: 700; cursor: pointer; }
      .submit-button:hover:not(:disabled) { background: var(--accent-strong); }

      .toast.visible { transform: translate(-50%, 0); opacity: 1; }

        .submit-row { min-width: 120px; gap: 6px; padding: 8px; }
