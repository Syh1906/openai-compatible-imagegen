name: Publish release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Annotated version tag to publish, for example v1.0.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  windows_candidate:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate the annotated release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          manifest_version="$(node -p "JSON.parse(require('node:fs').readFileSync('.codex-plugin/plugin.json', 'utf8')).version")"
          expected_tag="v${manifest_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match manifest version $manifest_version." >&2
            exit 1
          fi
          if ! object_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"; then
            echo "Release tag $RELEASE_TAG does not exist in the checked-out repository." >&2
            exit 1
          fi
          if [[ "$object_type" != "tag" ]]; then
            echo "Release tag $RELEASE_TAG must be annotated." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate versioned release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: node scripts/validate-release-notes.mjs --tag "$RELEASE_TAG"

      - name: Build the Plugin once
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check the Plugin package
        run: npm run check

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Build the Windows release candidate
        run: node scripts/build-release-artifacts.mjs --source-root . --output-directory release

      - name: Upload the Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: windows_candidate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Download the verified Windows release candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-windows
          path: candidates/windows

      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.windows_candidate.outputs.release_tag }}
          RELEASE_NOTES_PATH: .github/release-notes/${{ inputs.release_ref }}.md
        run: >-
          gh release create "$RELEASE_TAG" candidates/windows/*
          --verify-tag
          --title "$RELEASE_TAG"
          --notes-file "$RELEASE_NOTES_PATH"
