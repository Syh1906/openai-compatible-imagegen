name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build plugin package
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check plugin package
        run: npm run check
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Check diffs
        run: git diff --check
